name: SQLite compatibility

on:
  pull_request:
    branches: [develop, release-4.1, release-4.2]
  workflow_dispatch:

jobs:
  sqlite:
    name: SQLite PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, xml, fileinfo
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Test SQLite SQL and DQL
        run: vendor/bin/phpunit --no-configuration --bootstrap bootstrap.php application/test/OmekaTest/Db/Connection
